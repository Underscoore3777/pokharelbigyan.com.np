<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found</title>
  <meta name="robots" content="noindex">

  <script>
    (function () {
      // Matches /blog/ or /blog or /repo-name/blog/... (works on github.io too)
      if (/\/blog(\/|$)/.test(window.location.pathname)) {
        window.location.replace("https://blog.pokharelbigyan.com.np/");
      }
    })();
  </script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: #f7f7f8; color: #222; text-align: center; }
    a { color: #0b62d6; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Page not found.</p>
    <p><a href="/">Go to homepage</a></p>
  </main>
</body>
</html>
